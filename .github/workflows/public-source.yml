name: Public source boundary
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Validate submitted history, not GitHub-generated PR merge metadata.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node .github/test-public-data.mjs
      - run: node .github/test-public-history.mjs
      - run: node .github/check-public-data.mjs
      - run: node .github/check-public-data.mjs --history HEAD
