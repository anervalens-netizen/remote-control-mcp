name: Public source boundary
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/test-public-data.mjs
      - run: node .github/check-public-data.mjs
