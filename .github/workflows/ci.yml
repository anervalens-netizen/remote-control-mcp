name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Stop obsolete runs on the same ref instead of accumulating queued work.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job-scoped Git behavior, without mutating the owner/runner's global config.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  check:
    # Public workflow edits must never gain access to a personal-network runner.
    # Owner-native qualification is executed separately through the private control plane.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: false
      - name: Install pnpm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/rcmcp-pnpm" pnpm@10.29.3
          echo "$RUNNER_TEMP/rcmcp-pnpm/bin" >> "$GITHUB_PATH"
      - name: Install runtime tools (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Verify native runtime tools
        run: rg --version && go version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned browser and system dependencies (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Typecheck and test
        run: pnpm typecheck && pnpm vitest run --maxWorkers=4

  windows-native:
    runs-on: windows-latest
    env:
      RCMCP_TEST_INTERACTIVE: '0'
    # Hosted Windows is a deterministic non-interactive compatibility matrix.
    # Full Windows + interactive qualification runs owner-native on Gaming.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: false
      - name: Install pnpm
        shell: powershell
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'rcmcp-pnpm'
          npm install --global --prefix $prefix pnpm@10.29.3
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install ripgrep (GitHub-hosted Windows)
        if: runner.environment == 'github-hosted'
        shell: powershell
        run: choco install ripgrep --no-progress --yes
      - name: Verify native runtime tools
        shell: powershell
        run: |
          rg --version
          go version
      - name: Install dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile
      - name: Install pinned browser
        shell: powershell
        run: pnpm exec playwright-core install chromium
      - name: Typecheck and native Windows test
        shell: powershell
        run: |
          pnpm check:privacy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm vitest run tests/r13-coordination-fingerprint.test.ts tests/durable-batch-sdk.test.ts tests/shared-job-observer.test.ts tests/coordination-http.test.ts tests/reliability-results.test.ts tests/recovery.test.ts tests/m15-search.test.ts tests/audit39-transfer-copy.test.ts tests/rc25-cancellation-recovery.test.ts tests/m16-deadline-proof.test.ts tests/windows-identity.test.ts tests/windows-command-path.test.ts tests/windows-startup-regression.test.ts tests/windows-transfer-paths.test.ts tests/windows-deep-transfer.test.ts tests/windows-metadata.test.ts tests/windows-tree-compression.test.ts tests/windows-conpty.test.ts --maxWorkers=1 --no-file-parallelism
          exit $LASTEXITCODE
      - name: Report Windows coverage
        if: always()
        shell: powershell
        run: |
          if ($env:RCMCP_TEST_INTERACTIVE -eq '1') {
            'Windows native + interactive UIA/desktop acceptance requested; suite serialized to avoid shared-desktop interference.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            'Hosted Windows compatibility matrix: targeted native non-interactive R13/SDK/recovery/Windows regressions. Interactive UIA/desktop and the full Windows suite are explicitly not certified here; full native + interactive qualification runs separately on Gaming.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
